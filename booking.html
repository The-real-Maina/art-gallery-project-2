<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisan Gallery | Book a Visit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="logo">ARTISAN<span>.</span></div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="exhibitions.html">Exhibitions</a>
      <a href="artists.html">Artists</a>
      <a href="booking.html" class="active">Book a Visit</a>
    </nav>
  </header>

  <main class="container">
    <h1>Plan Your Visit</h1>
    <p>Complete the form below to reserve your place.</p>

    <!-- JS FORM VALIDATION -->
    <form id="bookingForm" onsubmit="validateForm(event)">
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="date">Visit Date:</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label for="visitors">Number of Visitors:</label>
        <input type="number" id="visitors" min="1" max="10" required>
      </div>

      <!-- JS Error & Success Containers -->
      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <button type="submit" class="btn">Submit Booking</button>
    </form>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 Artisan Gallery. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
